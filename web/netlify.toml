# Netlify: set the site's base directory to "web". Add ELEVENLABS_API_KEY under Site settings > Environment variables.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "accelerometer=(self), gyroscope=(self), xr-spatial-tracking=(self)"
    X-Content-Type-Options = "nosniff"

# three.js comes from the CDN on Netlify (locally it is served from node_modules)
[[redirects]]
  from = "/vendor/three/*"
  to = "https://cdn.jsdelivr.net/npm/three@0.180.0/:splat"
  status = 200

# Static ES module bundle; its 'three' import is resolved by the page import map.
[[redirects]]
  from = "/vendor/three-mesh-bvh/*"
  to = "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/:splat"
  status = 200
